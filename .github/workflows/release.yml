name: Release

# Publishes to PyPI when you cut a GitHub Release. The release tag must match
# the version in pyproject.toml (e.g. tag v0.2.0 for version = "0.2.0") — the
# guard step below fails the run if they disagree, so a mismatched tag never
# ships the wrong version.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "Release tag '$GITHUB_REF_NAME' != pyproject version '$version'" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI trusts this workflow by name via OIDC, so no API
    # token is stored anywhere. Configure it once at
    # pypi.org/manage/project/pipecat-backchannel/settings/publishing/.
    environment:
      name: pypi
      url: https://pypi.org/p/pipecat-backchannel
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
